name: Weather App CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test Weather App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Weather App
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q .

  build:
    name: Build and Publish Docker Image
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: roshnih19r/devops-monitoring-platform/.github/workflows/reusable-ci.yml@main
    with:
      image_name: ghcr.io/roshnih19r/weather-devops-app
      dockerfile: Dockerfile
      context: .

  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::672469410571:role/GitHubActions-Deploy
          aws-region: ap-south-1
          role-session-name: GitHubActionsDeploy

      - name: Check EC2 instance state
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids i-0ef295403c57130d2 \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          echo "EC2 state: $STATE"

          if [ "$STATE" != "running" ]; then
            echo "EC2 is not running. Start it manually before deployment."
            exit 1
          fi

      - name: Deploy using AWS Systems Manager
        shell: bash
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0ef295403c57130d2 \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["set -e","docker pull ghcr.io/roshnih19r/weather-devops-app:latest","docker stop weather-app || true","docker rm weather-app || true","docker run -d --name weather-app --restart unless-stopped -p 80:5000 ghcr.io/roshnih19r/weather-devops-app:latest","docker ps --filter name=weather-app"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0ef295403c57130d2 \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id i-0ef295403c57130d2
              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out."
          exit 1
