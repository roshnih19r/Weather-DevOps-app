name: Weather App CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    name: Test Weather App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Weather App
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q .

  build:
    name: Build and Publish Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: roshnih19r/devops-monitoring-platform/.github/workflows/reusable-ci.yml@main
    with:
      image_name: ghcr.io/roshnih19r/weather-devops-app
      dockerfile: Dockerfile
      context: .

  deploy:
    name: Deploy to AWS EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: roshnih19r/devops-monitoring-platform/.github/workflows/reusable-deploy.yml@main
    with:
      image_name: ghcr.io/roshnih19r/weather-devops-app
      role_to_assume: arn:aws:iam::672469410571:role/GitHubActions-Deploy
      aws_region: ap-south-1
      instance_id: i-0ef295403c57130d2
      container_name: weather-app
      host_port: "80"
      container_port: "5000"
      health_path: /health
