name: Weather App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Weather App
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q .

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    uses: roshnih19r/devops-monitoring-platform/.github/workflows/reusable-ci.yml@main
    with:
      image_name: ghcr.io/roshnih19r/weather-devops-app
      dockerfile: Dockerfile
      context: .
